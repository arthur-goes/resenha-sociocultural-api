services:
  app:
    build: .
    container_name: resenha-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${POSTGRESQL_URL:-jdbc:postgresql://db:5432/resenha-db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_PASSWORD:-admin}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JWT_RSA_PRIVATE_KEY_JSON=${RSA_PRIVATE_KEY_JSON}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - resenha-net

  db:
    image: ${POSTGRESQL_DOCKER_IMAGE:-postgres:14.19-alpine}
    container_name: resenha-db
    environment:
      - POSTGRES_DB=resenha-db
      - POSTGRES_USER=${POSTGRESQL_USERNAME:-admin}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resenha-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME:-admin} -d resenha-db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  resenha-net:
    driver: bridge

volumes:
  postgres_data:
