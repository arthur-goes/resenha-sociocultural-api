openapi: 3.0.3
info:
  title: API Resenha Sociocultural
  description: API of management for social project Resenha Sociocultural.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
tags:
  - name: Youths
    description: "Operations related to managing youths."

  - name: Meetings
    description: "Operations for creating, finding, and managing meetings."

  - name: Attendances
    description: "Operations for querying attendance records."

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
        type: oauth2
        description: "Authentication via JWT. The token must contain the roles required for the operation."
        flows:
          authorizationCode:
            authorizationUrl: http://localhost:8080/oauth2/authorize
            tokenUrl: http://localhost:8080/oauth2/token
            scopes:
              api: "Grants general access to the API. Authorization for specific endpoints is determined by user roles."

  responses:
    Unauthorized:
      description: Authentication is missing or invalid (Invalid Token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Access denied. User does not have permission for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: Invalid input data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AttendanceStatus:
      type: string
      description: Possible status for an attendance.
      enum:
        - PRESENT
        - ABSENT
        - EXCUSED_ABSENCE

    ########## MEETING SCHEMAS ##########
    MeetingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
          description: "The specific lesson or message read from the book 'Minutos de Sabedoria' (Minutes of Wisdom) during the meeting."
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceResponse'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeResponse'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointResponse'

    MeetingCreate:
      type: object
      required:
        - date
        - theme
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
          description: "The specific lesson or message read from the book 'Minutos de Sabedoria' (Minutes of Wisdom) during the meeting."
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceCreate'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeCreate'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointCreate'

    MeetingUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
          description: "The specific lesson or message read from the book 'Minutos de Sabedoria' (Minutes of Wisdom) during the meeting."
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceUpdate'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeUpdate'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointUpdate'

    ########## YOUTH SCHEMAS ##########
    YouthResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'
          description: 'A numeric string with a length of 10 to 11 characters.'
        creationDate:
          type: string
          format: date

    YouthSummary:
      type: object
      description: "Lightweight version of Youth for lists and embedding."
      required:
        - id
        - firstName
        - surname
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string

    YouthCreate:
      type: object
      required:
        - firstName
        - surname
        - birthDate
        - cpf
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    YouthUpdate:
      type: object
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    ########## ATTENDANCE SCHEMAS ##########
    AttendanceResponse:
      type: object
      required:
        - id
        - meetingId
        - youth
        - date
        - attendanceStatus
        - absenceExcuse
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        date:
          type: string
          format: date
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string
          nullable: true

    AttendanceCreate:
      type: object
      required:
        - youth
        - attendanceStatus
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    AttendanceUpdate:
      type: object
      required:
        - attendanceStatus
      properties:
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    ########## STRIKE SCHEMAS ##########
    StrikeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        meetingId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    StrikeCreate:
      type: object
      required:
        - youth
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    StrikeUpdate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string

    ########## PARTICIPATION POINT SCHEMAS ##########
    ParticipationPointResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ParticipationPointCreate:
      type: object
      required:
        - youth
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ParticipationPointUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string

    ########## ERROR SCHEMA ##########
    ErrorResponse:
      type: object
      description: "Standard error response."
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        reasonPhrase:
          type: string
        message:
          type: string
        path:
          type: string

paths:
  /attendances:
    get:
      tags: [ Attendances ]
      security:
        - bearerAuth: [ USER, COORDINATOR, ADMIN ]
      summary: List attendances
      description: |
        Returns a list of attendance records. The list can be filtered by the youth's name and/or the date of the meeting.

        Date filtering can be performed in two mutually exclusive ways:
        - **By a specific day:** Use the `date` parameter.
        - **By a date range:** Use both `initialDate` and `finalDate` parameters.

        Attempting to use `date` in conjunction with `initialDate` or `finalDate` will result in a 400 Bad Request error.

      operationId: findAttendances
      parameters:
        - name: name
          in: query
          required: false
          description: "Filter by a partial match on the youth's name or surname."
          schema: { type: string }
        - name: date
          in: query
          required: false
          description: "Filter attendances for a specific date. Cannot be used with 'initialDate' or 'finalDate'."
          schema: { type: string, format: date }
        - name: initialDate
          in: query
          required: false
          description: "The start date for a date range filter. Must be used with 'finalDate'."
          schema: { type: string, format: date }
        - name: finalDate
          in: query
          required: false
          description: "The end date for a date range filter. Must be used with 'initialDate'."
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [ Attendances ]
      security:
        - bearerAuth: [ ADMIN ]
      deprecated: true
      summary: Create a new Attendance (Not Implemented)
      description: |
        **This endpoint is reserved for future functionality and is not yet active.**

        It is designed to allow the creation of a single, standalone attendance record. 
        Currently, any call to this endpoint will result in a `501 Not Implemented` status.
      operationId: createAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCreate'
      responses:
        '501':
          description: Not Implemented - This endpoint is planned but not yet available.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meetings:
    get:
      tags: [ Meetings ]
      security:
        - bearerAuth: [ USER, COORDINATOR, ADMIN ]
      summary: List meetings with optional filters
      description: |
        Returns a list of all meetings. The list can be filtered by theme and/or date.

        Date filtering can be performed in two mutually exclusive ways:
        - **By a specific day:** Use the `date` parameter.
        - **By a date range:** Use both `initialDate` and `finalDate` parameters.

        Attempting to use `date` in conjunction with `initialDate` or `finalDate` will result in a 400 Bad Request error.

      operationId: getMeetings
      parameters:
        - name: theme
          in: query
          description: Filter the list by a partial match on the meeting's theme.
          schema: { type: string }
          required: false
        - name: initialDate
          in: query
          description: The start date for a date range filter. Must be used together with 'finalDate'.
          schema: { type: string, format: date }
          required: false
        - name: finalDate
          in: query
          description: The end date for a date range filter. Must be used together with 'initialDate'.
          schema: { type: string, format: date }
          required: false
        - name: date
          in: query
          description: A specific date to filter meetings. Cannot be used with 'initialDate' or 'finalDate'.
          schema: { type: string, format: date }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Meetings ]
      security:
        - bearerAuth: [ COORDINATOR, ADMIN ]
      summary: Create a new meeting
      description: |
        Registers a new meeting in the system.

        While `date` and `theme` are required, other information can be provided optionally:
        - **Attendances:** The `attendances` list can be omitted during creation. This allows for registering the meeting first and adding attendance records later via an update (e.g., using the PUT endpoint).
        - **Behavioral Records:** The `strikes` and `participationPoints` lists are also optional, as it is common for a meeting to occur without any specific behavioral incidents to record.

        Upon successful creation, the endpoint returns the complete meeting object and its URL in the Location header.

      operationId: createMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The URL of the newly created meeting resource
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meetings/{id}:
    get:
      tags: [ Meetings ]
      security:
        - bearerAuth: [ USER, COORDINATOR, ADMIN ]
      summary: Find a meeting by ID
      description: |
        Retrieves the full details of a specific meeting by its unique identifier.
        This includes all associated data such as attendance records, strikes, and participation points.
      operationId: findMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Meetings ]
      security:
        - bearerAuth: [ COORDINATOR, ADMIN ]
      summary: Update a meeting by its ID
      description: |
        Updates an existing meeting by replacing the entire resource with the provided data.

        **Important:** This method performs a full replacement. The request body should contain the complete meeting object. Any fields that are omitted from the request will be considered null or reset to their default values, effectively deleting them.

        The recommended workflow is to first retrieve the meeting using `GET /meetings/{id}`, modify the data as needed, and then send the entire, updated object back in the body of this PUT request.

      operationId: updateMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Meetings ]
      security:
        - bearerAuth: [ ADMIN ]
      summary: Delete a meeting by its ID
      description: |
        Permanently deletes a meeting and all of its associated data.

        **Warning:** This operation is irreversible. When a meeting is deleted, all of its related attendance records, strikes, and participation points are also permanently removed from the system (cascading delete).

        A successful deletion will return a 204 No Content response.

      operationId: deleteMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /youths:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: List youths
      description: |
        Returns all registered youths if no filter is provided.
  
        The name parameter performs a partial match. Any youth whose name or surname contains the provided string will be included in the results.

      operationId: findYouths
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Create a new youth
      description: |
        Registers a new youth in the system based on the provided data.
        All fields in the request body are required for a successful creation.
        Upon success, it returns a 201 Created status and the URL of the new resource in the Location header.
      operationId: createYouth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouthCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The URL of the newly created resource
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /youths/{id}:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Find a youth by id
      description: Retrieves the full details of a specific youth by their unique identifier.
      operationId: findYouthById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Partially update a youth by ID
      description: |
        Updates one or more fields of an existing youth.
        Only the fields provided in the request body will be updated. All other fields will remain unchanged.
        Upon successful update, the endpoint returns the complete and updated youth object.
      operationId: updateYouth
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouthUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Youths]
      security:
        - bearerAuth: [ADMIN]
      summary: Delete a youth by its ID.
      operationId: deleteYouthById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /youths/summary:
    get:
      tags: [ Youths ]
      security:
        - bearerAuth: [ USER, COORDINATOR, ADMIN ]
      summary: Get a summarized list of youths
      description: |
        Returns a lightweight list of youths, containing only their ID, name, and surname.
        This endpoint is optimized for performance and is ideal for populating UI elements like dropdowns or search-as-you-type fields.
        The optional 'name' parameter performs a partial match on the youth's name or surname.

      operationId: findYouthsSummarized
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'