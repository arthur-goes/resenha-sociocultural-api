spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resenha
    username: ${POSTGRESQL_USERNAME_DEV}
    password: ${POSTGRESQL_PASSWORD_DEV}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  jwt:
    rsa-private-key:
      json: ${DEV_RSA_PRIVATE_KEY_JSON:}
  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    root: WARN
    br.com.resenhasociocultural: DEBUG