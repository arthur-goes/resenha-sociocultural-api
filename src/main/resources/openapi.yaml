openapi: 3.0.3
info:
  title: API Resenha Sociocultural
  description: API of management for social project Resenha Sociocultural.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
tags:
  - name: Youths
  - name: Meetings
  - name: Attendances

components:
  securitySchemes:
    bearerAuth:
        type: oauth2
        description: "Authentication via JWT. The token must contain the roles (scopes) required for the operation."
        flows:
          authorizationCode: # Este é o fluxo recomendado!
            authorizationUrl: http://localhost:8080/oauth2/authorize
            tokenUrl: http://localhost:8080/oauth2/token
            scopes:
              ADMIN: "Acesso total a todas as operações."
              COORDINATOR: "Acesso para criar e atualizar dados."
              USER: "Acesso básico de leitura de dados."

  responses:
    Unauthorized:
      description: Authentication is missing or invalid (Invalid Token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: Access denied. User does not have permission for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    BadRequest:
      description: Invalid input data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    AttendanceStatus:
      type: string
      description: Possible status for an attendance.
      enum:
        - PRESENT
        - ABSENT
        - EXCUSED_ABSENCE

    ########## YOUTH SCHEMAS ##########
    YouthResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'
          description: 'A numeric string with a length of 10 to 11 characters.'
        creationDate:
          type: string
          format: date

    YouthSummary:
      type: object
      description: "Lightweight version of Youth for lists and embedding."
      required:
        - id
        - firstName
        - surname
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string

    YouthCreate:
      type: object
      required:
        - firstName
        - surname
        - birthDate
        - cpf
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    YouthUpdate:
      type: object
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    ########## MEETING SCHEMAS ##########
    MeetingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceResponse'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeResponse'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointResponse'

    MeetingCreate:
      type: object
      required:
        - date
        - theme
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceCreate'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeCreate'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointCreate'

    MeetingUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceUpdate'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/StrikeUpdate'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPointUpdate'

    ########## ATTENDANCE SCHEMAS ##########
    AttendanceResponse:
      type: object
      required:
        - id
        - meetingId
        - youth
        - date
        - attendanceStatus
        - absenceExcuse
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        date:
          type: string
          format: date
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string
          nullable: true

    AttendanceCreate:
      type: object
      required:
        - youth
        - attendanceStatus
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    AttendanceUpdate:
      type: object
      required:
        - attendanceStatus
      properties:
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    ########## STRIKE SCHEMAS ##########
    StrikeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        meetingId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    StrikeCreate:
      type: object
      required:
        - youth
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    StrikeUpdate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string

    ########## PARTICIPATION POINT SCHEMAS ##########
    ParticipationPointResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ParticipationPointCreate:
      type: object
      required:
        - youth
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
          nullable: true
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ParticipationPointUpdate:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string

    ########## ERROR SCHEMA ##########
    ApiError:
      type: object
      description: "Standard error response."
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        reasonPhrase:
          type: string
        message:
          type: string
        path:
          type: string

security:
  - bearerAuth: []

paths:
  /youths:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]   
      summary: List Youth with optional filter for name and/or surname
      operationId: findYouths
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Create new Youth
      operationId: createYouth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouthCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL for location of created resource
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /youths/summary:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: Summarized list for Youths containing id, name and surname.
      operationId: findYouthsSummarized
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /youths/{id}:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Search a Youth by its ID
      operationId: findYouthById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Partially update a Youth by its ID.
      operationId: updateYouth
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouthUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Youths]
      security:
        - bearerAuth: [ADMIN]
      summary: Delete a Youth by its ID.
      operationId: deleteYouthById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings:
    get:
      tags: [Meetings]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: List meetings, optionally filtering by date and/or theme.
      description: |
        Returns a list of meetings according to the specified filters.

        If no filters are provided, all meetings are returned.

        For date filtering, you have two options:
          - Use the `date` parameter to find meetings on a specific day.
          - Use `initialDate` and `finalDate` to find meetings within a date range.

        Note: The single date filter and the date range filter are mutually exclusive and cannot be used at the same time.

      operationId: getMeetings
      parameters:
        - name: theme
          in: query
          schema: { type: string }
          required: false
        - name: initialDate
          in: query
          schema: { type: string, format: date }
          required: false
        - name: finalDate
          in: query
          schema: { type: string, format: date }
          required: false
        - name: date
          in: query
          schema: { type: string, format: date }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Meetings]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Create a new meeting
      operationId: createMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meetings/{id}:
    get:
      tags: [Meetings]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: Search meeting by its ID
      operationId: findMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Meetings]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Update a meeting by its ID
      operationId: updateMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Meetings]
      security:
        - bearerAuth: [ADMIN]
      summary: Delete a meeting by its ID
      operationId: deleteMeeting
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attendances:
    get:
      tags: [Attendances]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: List all Attendances. Optionally can filter by Youth name or date.
      operationId: findAttendances
      parameters:
        - name: name
          in: query
          required: false
          description: "Substring to search. Will be compared against both name and surname."
          schema: { type: string }
        - name: date
          in: query
          required: false
          description: "Specific date filter."
          schema: { type: string, format: date }
        - name: initialDate
          in: query
          required: false
          description: "Start date for range filter."
          schema: { type: string, format: date }
        - name: finalDate
          in: query
          required: false
          description: "End date for range filter."
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
