spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

openapi-config:
  server-url: https://resenha-sociocultural-api.onrender.com
  auth-url: https://resenha-sociocultural-api.onrender.com/oauth2/authorize
  token-url: https://resenha-sociocultural-api.onrender.com/oauth2/token
  server-description: Staging Server

app:
  database:
    seed-on-startup: true
