openapi: 3.0.3
info:
  title: API Resenha Sociocultural
  description: API of management for social project Resenha Sociocultural.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development Server
tags:
  - name: Youths
  - name: Meetings
  - name: Attendances

components:
  securitySchemes:
    bearerAuth:
        type: oauth2
        description: "Authentication via JWT. The token must contain the roles (scopes) required for the operation."
        flows:
          implicit:
            authorizationUrl: http://localhost:8080/oauth/authorize
            scopes:
              ADMIN: "Grants full access to all operations, including destructive and administrative ones."
              
              COORDINATOR: "Grants access to create and update data, in addition to read operations."
              USER: "Grants basic access to read data."

  responses:
    Unauthorized:
      description: Authentication is missing or invalid (Invalid Token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: Access denied. User does not have permission for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    BadRequest:
      description: Invalid input data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    AttendanceStatus:
      type: string
      description: Possible status for an attendance.
      enum:
        - PRESENT
        - ABSENT
        - EXCUSED_ABSENCE

    ########## YOUTH SCHEMAS ##########
    Youth:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'
          description: 'A numeric string with a length of 10 to 11 characters.'
        creationDate:
          type: string
          format: date

    YouthSummary:
      type: object
      description: "Lightweight version of Youth for lists and embedding."
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        surname:
          type: string

    NewYouth:
      type: object
      required:
        - firstName
        - surname
        - birthDate
        - cpf
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    UpdateYouth:
      type: object
      properties:
        firstName:
          type: string
        surname:
          type: string
        birthDate:
          type: string
          format: date
        cpf:
          type: string
          pattern: '^\d{11}$'
        motherName:
          type: string
        fatherName:
          type: string
        emergencyContactName:
          type: string
        emergencyContactRelationship:
          type: string
        emergencyContactPhone:
          type: string
          pattern: '^\d{10,11}$'

    ########## MEETING SCHEMAS ##########
    Meeting:
      type: object
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/Strike'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/ParticipationPoint'

    NewMeeting:
      type: object
      required:
        - date
        - theme
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string
        attendances:
          type: array
          items:
            $ref: '#/components/schemas/NewAttendance'
        strikes:
          type: array
          items:
            $ref: '#/components/schemas/NewStrike'
        participationPoints:
          type: array
          items:
            $ref: '#/components/schemas/NewParticipationPoint'

    UpdateMeeting:
      type: object
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        minutosDeSabedoriaLesson:
          type: string

    ########## ATTENDANCE SCHEMAS ##########
    Attendance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        date:
          type: string
          format: date
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    NewAttendance:
      type: object
      required:
        - youthId
        - attendanceStatus
      properties:
        meetingId:
          type: integer
          format: int64
        youthId:
          type: integer
          format: int64
        attendanceStatus:
          $ref: '#/components/schemas/AttendanceStatus'
        absenceExcuse:
          type: string

    ########## STRIKE SCHEMAS ##########
    Strike:
      type: object
      properties:
        id:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        meetingId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    NewStrike:
      type: object
      required:
        - youthId
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
        youthId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ########## PARTICIPATION POINT SCHEMAS ##########
    ParticipationPoint:
      type: object
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        youth:
          $ref: '#/components/schemas/YouthSummary'
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    NewParticipationPoint:
      type: object
      required:
        - youthId
        - amount
        - active
      properties:
        meetingId:
          type: integer
          format: int64
        youthId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        reason:
          type: string
        active:
          type: boolean

    ########## ERROR SCHEMA ##########
    ApiError:
      type: object
      description: "Standard error response."
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        reasonPhrase:
          type: string
        message:
          type: string
        path:
          type: string

security:
  - bearerAuth: []

paths:
  /youths:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]   
      summary: List Youth with optional filter for name.
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Youth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Create new Youth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewYouth'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL for location of created resource
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /youths/summary:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: Summarized list for Youths containing id, name and surname.
      parameters:
        - name: name
          in: query
          schema: { type: string }
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /youths/{id}:
    get:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Search a Youth by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Youth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Youths]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Partially update a Youth by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateYouth'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Youth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Youths]
      security:
        - bearerAuth: [ADMIN]
      summary: Delete a Youth by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /meetings:
    get:
      tags: [Meetings]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: List meetings, optionally filtering by date and/or theme.
      parameters:
        - name: theme
          in: query
          schema: { type: string }
        - name: initialDate
          in: query
          schema: { type: string, format: date }
        - name: finalDate
          in: query
          schema: { type: string, format: date }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Meetings]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Create a new meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMeeting'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /meetings/{id}:
    get:
      tags: [Meetings]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: Search meeting by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Meetings]
      security:
        - bearerAuth: [COORDINATOR, ADMIN]
      summary: Update a meeting by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeeting'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Meetings]
      security:
        - bearerAuth: [ADMIN]
      summary: Delete a meeting by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attendances:
    get:
      tags: [Attendances]
      security:
        - bearerAuth: [USER, COORDINATOR, ADMIN]
      summary: List Attendances by associated meeting ID. Optionally filtering by Youth name or date.
      parameters:
        - name: name
          in: query
          description: "Substring to search. Will be compared against both name and surname."
          schema: { type: string }
        - name: date
          in: query
          description: "Specific date filter."
          schema: { type: string, format: date }
        - name: initialDate
          in: query
          description: "Start date for range filter."
          schema: { type: string, format: date }
        - name: finalDate
          in: query
          description: "End date for range filter."
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
